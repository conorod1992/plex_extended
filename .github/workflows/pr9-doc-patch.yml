name: Apply PR9 documentation patch

on:
  push:
    branches:
      - feat/pr9-watch-state-mutations
    paths:
      - .github/workflows/pr9-doc-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr9-watch-state-mutations
      - name: Apply focused metadata and README updates
        shell: python
        run: |
          from pathlib import Path

          services = Path("custom_components/plex_extended/services.yaml")
          text = services.read_text()
          marker = "\nlist_collections:\n"
          assert marker in text
          mutation_services = '''
mark_watched:
  name: Mark watched
  description: Mark one exact local Plex item watched for the selected/default Plex user. This changes Plex viewing state. Marking a show or season also affects its child episodes.
  fields:
    config_entry_id:
      name: Plex server
      selector:
        config_entry:
          integration: plex_extended
    rating_key:
      name: Rating key
      description: Stable local Plex rating key returned by another Plex Extended action.
      required: true
      selector:
        text:
    user:
      name: Plex user
      description: Optional Plex user name. Overrides the configured default user for this change.
      selector:
        text:
    user_id:
      name: Plex user ID
      description: Optional stable Plex account ID. Overrides the configured default user for this change.
      selector:
        text:

mark_unwatched:
  name: Mark unwatched
  description: Mark one exact local Plex item unwatched for the selected/default Plex user. This changes Plex viewing state. Marking a show or season also affects its child episodes.
  fields:
    config_entry_id:
      name: Plex server
      selector:
        config_entry:
          integration: plex_extended
    rating_key:
      name: Rating key
      description: Stable local Plex rating key returned by another Plex Extended action.
      required: true
      selector:
        text:
    user:
      name: Plex user
      description: Optional Plex user name. Overrides the configured default user for this change.
      selector:
        text:
    user_id:
      name: Plex user ID
      description: Optional stable Plex account ID. Overrides the configured default user for this change.
      selector:
        text:
'''
          services.write_text(text.replace(marker, "\n" + mutation_services + "\nlist_collections:\n", 1))

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace(
              "- Supports stable Plex library/user/collection/playlist rating keys as well as convenient names.\n",
              "- Supports stable Plex library/user/collection/playlist rating keys as well as convenient names.\n"
              "- Provides explicit watched/unwatched update actions; Assist write tools are opt-in and disabled by default.\n",
              1,
          )
          text = text.replace(
              "including watched/unwatched filtering, search/detail metadata, recently added metadata, TV progress, Continue Watching, On Deck, collections/playlists, and watch history.",
              "including watched/unwatched filtering, search/detail metadata, recently added metadata, TV progress, Continue Watching, On Deck, collections/playlists, watch history, and explicit watch-state updates.",
              1,
          )
          text = text.replace(
              "- `plex_extended.media_details` for returned watched/progress metadata\n",
              "- `plex_extended.media_details` for returned watched/progress metadata\n"
              "- `plex_extended.mark_watched` / `plex_extended.mark_unwatched` for explicit viewing-state changes\n",
              1,
          )
          action_marker = "\n### `plex_extended.list_collections`\n"
          assert action_marker in text
          action_docs = '''
### `plex_extended.mark_watched` / `plex_extended.mark_unwatched`

Explicitly change one local Plex item's viewing state for the selected/default Plex user. These are side-effecting actions and therefore require an exact local `rating_key`; they deliberately do not accept a title lookup.

```yaml
action: plex_extended.mark_watched
data:
  rating_key: "1234"
response_variable: plex_update
```

Plex Extended refetches the item after the write and returns an error if Plex does not confirm the requested state. The response includes the previous and current watched state plus the effective Plex user. For shows and seasons, Plex applies the state to child episodes as well; the response reports `scope: item_and_children` so that cascade is explicit.

The manual Home Assistant actions are always available. Native Assist write tools are a separate opt-in controlled by **Settings → Devices & services → Plex Extended → Configure → Allow Assist to change Plex watch state**.
'''
          text = text.replace(action_marker, "\n" + action_docs + action_marker, 1)
          text = text.replace(
              "- `plex_extended__media_details`\n",
              "- `plex_extended__media_details`\n"
              "- `plex_extended__mark_watched` *(only when Assist write access is enabled)*\n"
              "- `plex_extended__mark_unwatched` *(only when Assist write access is enabled)*\n",
              1,
          )
          text = text.replace(
              '- "Where is Guest up to in that show?"\n',
              '- "Where is Guest up to in that show?"\n- "Mark that episode as watched."\n',
              1,
          )
          llm_para = "The LLM guidance distinguishes fuzzy search, structured library querying, TV progress, recent-media windows, collections/playlists, and account-level Watchlist. It prefers stable rating keys when moving from collection/playlist listing to item retrieval and understands that Watchlist is not affected by the configured household-user default.\n"
          assert llm_para in text
          text = text.replace(
              llm_para,
              llm_para + "\nWatch-state mutation tools are **not exposed to Assist by default**. When explicitly enabled in the integration options, the model is instructed to use them only for an explicit user request, resolve an exact local `rating_key` with a read tool first, and never invent an identifier. In multi-server setups, write tools expose only the server entries on which this option is enabled.\n",
              1,
          )
          text = text.replace(
              "- **Plex Extended:** querying the library, metadata, recent additions, collections/playlists/Watchlist, per-user viewing state/history/progress, and LLM/automation access.",
              "- **Plex Extended:** querying the library, metadata, recent additions, collections/playlists/Watchlist, per-user viewing state/history/progress, controlled watch-state updates, and LLM/automation access.",
              1,
          )
          text = text.replace(
              "Version `0.1.0` focuses on read/query functionality. It deliberately does not yet add playback control, destructive library operations, watch-state mutation, or Tautulli-specific analytics.",
              "Version `0.1.0` focuses on query functionality plus narrowly scoped, explicit watched/unwatched updates. It deliberately does not add playback control, broader destructive library operations, or Tautulli-specific analytics.",
              1,
          )
          readme.write_text(text)

          Path(".github/workflows/pr9-doc-patch.yml").unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: document safe watch-state mutations"
          git push origin HEAD:feat/pr9-watch-state-mutations
