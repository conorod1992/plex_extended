name: Correct PR9 action metadata

on:
  push:
    branches:
      - feat/pr9-watch-state-mutations
    paths:
      - .github/workflows/pr9-yaml-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr9-watch-state-mutations
      - name: Correct selector indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("custom_components/plex_extended/services.yaml")
          text = path.read_text()
          broken = "        config_entry:\nintegration: plex_extended"
          fixed = "        config_entry:\n          integration: plex_extended"
          assert text.count(broken) == 2
          path.write_text(text.replace(broken, fixed))
          Path(".github/workflows/pr9-yaml-fix.yml").unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct watch-state action metadata"
          git push origin HEAD:feat/pr9-watch-state-mutations
