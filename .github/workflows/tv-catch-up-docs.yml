name: Apply TV catch-up docs

on:
  push:
    paths:
      - ".github/workflows/tv-catch-up-docs.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tv-catch-up-query
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Patch docs and service metadata
        run: python .github/scripts/tv_catch_up_docs.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: document TV catch-up query"
          git push origin HEAD:feat/tv-catch-up-query
