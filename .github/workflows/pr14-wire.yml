name: Apply PR14 richer library filters

on:
  push:
    branches:
      - feat/pr14-richer-library-filters
    paths:
      - .github/workflows/pr14-wire.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr14-richer-library-filters
      - name: Apply PR14 patch
        run: python .github/scripts/pr14_patch.py
      - name: Remove temporary helpers
        run: rm .github/workflows/pr14-wire.yml .github/scripts/pr14_patch.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add richer Plex library filters"
          git push origin HEAD:feat/pr14-richer-library-filters
