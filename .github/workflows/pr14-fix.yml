name: Apply PR14 filter type fix

on:
  push:
    branches:
      - feat/pr14-richer-library-filters
    paths:
      - .github/workflows/pr14-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr14-richer-library-filters
      - name: Apply fix
        run: python .github/scripts/pr14_fix.py
      - name: Remove temporary helpers
        run: rm .github/workflows/pr14-fix.yml .github/scripts/pr14_fix.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve PlexAPI channel filter semantics"
          git push origin HEAD:feat/pr14-richer-library-filters
