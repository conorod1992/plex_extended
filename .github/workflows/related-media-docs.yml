name: Apply related-media docs

on:
  push:
    paths:
      - ".github/workflows/related-media-docs.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr17-related-media
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Patch docs and service metadata
        run: python .github/scripts/related_media_docs.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: document related-media queries"
          git push origin HEAD:feat/pr17-related-media
