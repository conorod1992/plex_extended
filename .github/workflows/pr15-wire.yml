name: Apply PR15 playlist wiring

on:
  push:
    branches:
      - feat/pr15-safe-playlist-mutations
    paths:
      - .github/workflows/pr15-wire.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr15-safe-playlist-mutations
      - name: Apply shared wiring
        run: python .github/scripts/pr15_patch.py
      - name: Remove temporary helpers
        run: rm .github/scripts/pr15_patch.py .github/workflows/pr15-wire.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire safe playlist mutations"
          git push origin HEAD:feat/pr15-safe-playlist-mutations
