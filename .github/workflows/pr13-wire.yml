name: Apply PR13 wiring
on:
  push:
    branches:
      - feat/pr13-discover-watchlist-mutations
    paths:
      - .github/workflows/pr13-wire.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr13-discover-watchlist-mutations
      - run: python .github/scripts/pr13_patch.py
      - run: rm .github/workflows/pr13-wire.yml .github/scripts/pr13_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose Plex Discover and safe Watchlist writes"
          git push origin HEAD:feat/pr13-discover-watchlist-mutations
