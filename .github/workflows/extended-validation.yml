name: Extended PlexAPI validation

on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-matrix:
    name: PlexAPI contract tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Install integration test requirements
        run: python -m pip install pytest plexapi==4.18.2
      - name: Exercise real PlexAPI and regression suites
        run: python -m pytest -q tests tests_contract
