name: Apply PR10 metadata and docs

on:
  push:
    branches:
      - feat/pr10-active-streams
    paths:
      - .github/workflows/pr10-doc-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr10-active-streams
      - name: Apply metadata and documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          services = Path("custom_components/plex_extended/services.yaml")
          text = services.read_text()
          if "\nactive_streams:\n" not in text:
              anchor = "\nmark_watched:\n"
              assert anchor in text
              block = '''
          active_streams:
            name: Active streams
            description: Return current Plex playback sessions including user, media, player, progress, location, source quality and delivery details.
            fields:
              config_entry_id:
                name: Plex server
                description: Plex Extended server to query. Optional when only one server is configured.
                selector:
                  config_entry:
                    integration: plex_extended
              user:
                name: Plex user
                description: Optional exact Plex username to filter active sessions.
                selector:
                  text:
              media_types:
                name: Media types
                description: Optional Plex media types to include.
                selector:
                  select:
                    multiple: true
                    options:
                      - movie
                      - show
                      - season
                      - episode
                      - artist
                      - album
                      - track
                      - collection
              states:
                name: Playback states
                description: Optional playback states to include.
                selector:
                  select:
                    multiple: true
                    options:
                      - playing
                      - paused
                      - buffering
              locality:
                name: Location
                description: Filter local or remote sessions. Any returns both.
                default: any
                selector:
                  select:
                    options:
                      - any
                      - local
                      - remote
              limit:
                name: Limit
                default: 50
                selector:
                  number:
                    min: 1
                    max: 50
                    mode: box
          '''
              services.write_text(text.replace(anchor, "\n" + block + "\nmark_watched:\n", 1))

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace(
              "Plex Watchlist, Continue Watching, On Deck, metadata, libraries, and users.",
              "Plex Watchlist, Continue Watching, On Deck, active playback sessions, metadata, libraries, and users.",
              1,
          )
          highlight = "- Exposes episode-level TV progress, last watched/current episode, and the next episode to watch.\n"
          assert highlight in text
          text = text.replace(
              highlight,
              highlight + "- Exposes current Plex playback sessions, including player/progress and direct-play/direct-stream/transcode details.\n",
              1,
          )
          action_anchor = "\n### `plex_extended.mark_watched` / `plex_extended.mark_unwatched`\n"
          assert action_anchor in text
          action_docs = '''
          ### `plex_extended.active_streams`

          Returns current Plex playback sessions without controlling the player. Results can include the Plex user, media and progress, player/product/platform, local/remote/relay/security state, selected source quality, session bandwidth/location, and delivery details.

          ```yaml
          action: plex_extended.active_streams
          data:
            locality: remote
            states:
              - playing
          response_variable: plex_streams
          ```

          Delivery is classified as `direct_play`, `direct_stream`, `transcode`, or `unknown`. A Plex transcode-session wrapper whose media components are copied rather than transcoded is reported as `direct_stream`, not as a true transcode. Client IP/public addresses, device machine identifiers, Plex tokens, session IDs, and local media file paths are deliberately not returned.

          Filters are available for exact Plex username, media type, playback state, local/remote location, and result limit. This action is read-only; it does not pause, stop, or otherwise control playback.
          '''
          text = text.replace(action_anchor, "\n" + action_docs + action_anchor, 1)
          llm_anchor = "- `plex_extended__media_details`\n"
          assert llm_anchor in text
          text = text.replace(
              llm_anchor,
              llm_anchor + "- `plex_extended__active_streams`\n",
              1,
          )
          example_anchor = '- "Give me my Continue Watching list."\n'
          assert example_anchor in text
          text = text.replace(
              example_anchor,
              example_anchor + '- "Who is using Plex right now?"\n- "Is anything currently transcoding?"\n',
              1,
          )
          relation = "- **Plex Extended:** querying the library, metadata, recent additions, collections/playlists/Watchlist, per-user viewing state/history/progress, controlled watch-state updates, and LLM/automation access."
          assert relation in text
          text = text.replace(
              relation,
              "- **Plex Extended:** querying the library, metadata, recent additions, collections/playlists/Watchlist, active playback sessions, per-user viewing state/history/progress, controlled watch-state updates, and LLM/automation access.",
              1,
          )
          readme.write_text(text)

          Path(".github/workflows/pr10-doc-patch.yml").unlink()
          PY
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: document active Plex stream queries"
          git push origin HEAD:feat/pr10-active-streams
