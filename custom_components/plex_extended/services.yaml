search:
  name: Search Plex
  description: Search media titles in the configured Plex libraries and return matching items.
  fields:
    config_entry_id:
      name: Plex server
      description: Plex Extended server to query. Optional when only one server is configured.
      selector:
        config_entry:
          integration: plex_extended
    query:
      name: Query
      description: Title or search text.
      required: true
      selector:
        text:
    search_types:
      name: Media types
      description: Plex media types to include in the search.
      default:
        - movie
        - show
      selector:
        select:
          multiple: true
          options:
            - movie
            - show
            - season
            - episode
            - artist
            - album
            - track
            - collection
    limit:
      name: Limit
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
    library:
      name: Library
      description: Optional exact Plex library name. Use library ID if names are duplicated.
      selector:
        text:
    library_id:
      name: Library ID
      description: Optional stable Plex library section ID returned by List libraries.
      selector:
        text:
    user:
      name: Plex user
      description: Optional Plex user name. Overrides the configured default user for watched/progress fields returned by search.
      selector:
        text:
    user_id:
      name: Plex user ID
      description: Optional stable Plex account ID returned by List users. Overrides the configured default user; if both name and ID are supplied, they must match.
      selector:
        text:
    include_summary:
      name: Include summary
      default: true
      selector:
        boolean:
    include_technical:
      name: Include technical metadata
      description: Fetch codec, resolution, bitrate and related media metadata. This can require extra Plex requests.
      default: false
      selector:
        boolean:

query_library:
  name: Query Plex library
  description: Find Plex media using structured filters such as genre, people, year, watch state, runtime, quality, ratings and dates.
  fields:
    config_entry_id:
      name: Plex server
      description: Plex Extended server to query. Optional when only one server is configured.
      selector:
        config_entry:
          integration: plex_extended
    media_type:
      name: Media type
      description: Type of Plex item to return.
      required: true
      selector:
        select:
          options:
            - movie
            - show
            - season
            - episode
            - artist
            - album
            - track
    library:
      name: Library
      description: Optional Plex library name. If omitted, Plex Extended uses it automatically only when exactly one compatible library exists.
      selector:
        text:
    library_id:
      name: Library ID
      description: Optional stable Plex library section ID returned by List libraries.
      selector:
        text:
    user:
      name: Plex user
      description: Optional Plex user name. Overrides the configured default Plex user for watched, unwatched, in-progress and other user-state fields.
      selector:
        text:
    user_id:
      name: Plex user ID
      description: Optional stable Plex account ID returned by List users. Overrides the configured default user; if both name and ID are supplied, they must match.
      selector:
        text:
    title:
      name: Title contains
      description: Optional partial title filter.
      selector:
        text:
    genres:
      name: Any genre
      description: Match any supplied genre. A single value can be entered in the UI; YAML can supply a list.
      selector:
        text:
    genres_all:
      name: All genres
      description: Require all supplied genres. A single value can be entered in the UI; YAML can supply a list.
      selector:
        text:
    actors:
      name: Actors
      description: Match any supplied actor. YAML can supply a list.
      selector:
        text:
    directors:
      name: Directors
      description: Match any supplied director. YAML can supply a list.
      selector:
        text:
    collections:
      name: Collections
      description: Match any supplied Plex collection. YAML can supply a list.
      selector:
        text:
    content_ratings:
      name: Content ratings
      description: Match any supplied content rating, such as PG-13 or TV-MA. YAML can supply a list.
      selector:
        text:
    studios:
      name: Studios
      description: Match any supplied studio. YAML can supply a list.
      selector:
        text:
    year:
      name: Exact year
      selector:
        number:
          min: 0
          max: 9999
          mode: box
    year_min:
      name: Earliest year
      description: Inclusive minimum year.
      selector:
        number:
          min: 0
          max: 9999
          mode: box
    year_max:
      name: Latest year
      description: Inclusive maximum year.
      selector:
        number:
          min: 0
          max: 9999
          mode: box
    decade:
      name: Decade
      description: Decade beginning year, for example 1980.
      selector:
        number:
          min: 0
          max: 9990
          step: 10
          mode: box
    watched_state:
      name: Watched state
      default: any
      description: Plex-native watched state filter evaluated for the selected/default Plex user.
      selector:
        select:
          options:
            - any
            - watched
            - unwatched
            - in_progress
    resolutions:
      name: Resolutions
      description: Match Plex resolution values such as 4k, 1080 or 720. YAML can supply a list.
      selector:
        text:
    hdr:
      name: HDR state
      default: any
      selector:
        select:
          options:
            - any
            - hdr
            - sdr
    critic_rating_min:
      name: Minimum critic rating
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
    critic_rating_max:
      name: Maximum critic rating
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
    audience_rating_min:
      name: Minimum audience rating
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
    audience_rating_max:
      name: Maximum audience rating
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
    user_rating_min:
      name: Minimum user rating
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
    user_rating_max:
      name: Maximum user rating
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
    duration_min_minutes:
      name: Minimum runtime
      description: Inclusive minimum runtime in minutes.
      selector:
        number:
          min: 0
          mode: box
    duration_max_minutes:
      name: Maximum runtime
      description: Inclusive maximum runtime in minutes.
      selector:
        number:
          min: 0
          mode: box
    added_after:
      name: Added after
      description: Plex date such as 2026-01-01, or a relative value such as 30d.
      selector:
        text:
    added_before:
      name: Added before
      description: Plex date such as 2026-01-01, or a relative value such as 30d.
      selector:
        text:
    last_viewed_after:
      name: Last viewed after
      description: Plex date such as 2026-01-01, or a relative value such as 30d.
      selector:
        text:
    last_viewed_before:
      name: Last viewed before
      description: Plex date such as 2026-01-01, or a relative value such as 30d.
      selector:
        text:
    sort_by:
      name: Sort by
      selector:
        select:
          options:
            - title
            - year
            - added_at
            - last_viewed_at
            - critic_rating
            - audience_rating
            - user_rating
            - duration
            - resolution
    sort_order:
      name: Sort order
      description: If omitted, title sorts ascending and other fields sort descending.
      selector:
        select:
          options:
            - asc
            - desc
    limit:
      name: Limit
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
    include_summary:
      name: Include summary
      default: true
      selector:
        boolean:
    include_technical:
      name: Include technical metadata
      description: Fetch codec, resolution, bitrate and related metadata for each result. This can require extra Plex requests.
      default: false
      selector:
        boolean:

watch_status:
  name: TV watch status
  description: Return episode-level viewing progress for one Plex TV show, including completion, last watched episode, current progress and the next episode to watch.
  fields:
    config_entry_id:
      name: Plex server
      description: Plex Extended server to query. Optional when only one server is configured.
      selector:
        config_entry:
          integration: plex_extended
    rating_key:
      name: Show rating key
      description: Stable Plex rating key for the TV show. Preferred when already known from Search or Query library.
      selector:
        text:
    title:
      name: Show title
      description: TV show title to resolve when a rating key is not supplied. Exact matches are preferred; ambiguous matches require a rating key or year.
      selector:
        text:
    year:
      name: Show year
      description: Optional year to disambiguate shows with the same or similar title.
      selector:
        number:
          min: 0
          max: 9999
          mode: box
    library:
      name: Library
      description: Optional exact TV library name.
      selector:
        text:
    library_id:
      name: Library ID
      description: Optional stable Plex TV library section ID returned by List libraries.
      selector:
        text:
    user:
      name: Plex user
      description: Optional Plex user name. Overrides the configured default Plex user for episode progress and next-episode state.
      selector:
        text:
    user_id:
      name: Plex user ID
      description: Optional stable Plex account ID returned by List users. Overrides the configured default user; if both name and ID are supplied, they must match.
      selector:
        text:
    include_specials:
      name: Include specials
      description: Include season 0/special episodes in counts, completion and next-episode fallback logic.
      default: false
      selector:
        boolean:
    include_seasons:
      name: Include season breakdown
      description: Include compact watched/unwatched counts for each season.
      default: true
      selector:
        boolean:
    include_summary:
      name: Include summaries
      description: Include show and episode summaries in the returned show/episode objects.
      default: true
      selector:
        boolean:

recently_added:
  name: Recently added
  description: Return recently added Plex media with optional time windows and TV episode grouping.
  fields:
    config_entry_id:
      name: Plex server
      selector:
        config_entry:
          integration: plex_extended
    limit:
      name: Limit
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
    library:
      name: Library
      description: Optional exact Plex library name. Use library ID if names are duplicated.
      selector:
        text:
    library_id:
      name: Library ID
      description: Optional stable Plex library section ID returned by List libraries.
      selector:
        text:
    user:
      name: Plex user
      description: Optional Plex user name. Overrides the configured default user for watched/progress metadata on returned items.
      selector:
        text:
    user_id:
      name: Plex user ID
      description: Optional stable Plex account ID returned by List users. Overrides the configured default user; if both name and ID are supplied, they must match.
      selector:
        text:
    since:
      name: Since
      description: Inclusive start of the time window. Use an ISO date or datetime; date-only values use Home Assistant's timezone.
      selector:
        text:
    before:
      name: Before
      description: Exclusive end of the time window. Use an ISO date or datetime; date-only values use Home Assistant's timezone.
      selector:
        text:
    within_days:
      name: Within days
      description: Return items from the trailing number of days. Cannot be combined with Since or Before.
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    media_types:
      name: Media types
      selector:
        select:
          multiple: true
          options:
            - movie
            - show
            - season
            - episode
            - artist
            - album
            - track
            - collection
    group_tv_by:
      name: Group TV episodes
      description: Collapse recently added TV episodes by show or season. None preserves the normal individual-item behavior.
      default: none
      selector:
        select:
          options:
            - none
            - show
            - season
    include_summary:
      name: Include summary
      default: true
      selector:
        boolean:

