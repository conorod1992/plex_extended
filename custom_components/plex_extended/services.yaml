add_to_watchlist:
  name: Add to Plex Watchlist
  description: Add one exact Plex Discover movie/show to the configured plex.tv account's Watchlist. Requires the GUID and title returned by Search Plex Discover; the GUID is the authoritative identity.
  fields:
    config_entry_id:
      name: Plex server
      description: Plex Extended connection whose configured plex.tv account is changed.
      selector:
        config_entry:
          integration: plex_extended
    guid:
      name: Discover GUID
      description: Exact plex://movie/... or plex://show/... GUID returned by Search Plex Discover.
      required: true
      selector:
        text:
    title:
      name: Title
      description: Title returned with the Discover GUID. Used only to re-fetch candidates; the write is allowed only when the GUID matches exactly.
      required: true
      selector:
        text:
    media_type:
      name: Media type
      description: Optional movie/show assertion. If supplied, it must match the Discover GUID.
      selector:
        select:
          options:
            - movie
            - show

remove_from_watchlist:
